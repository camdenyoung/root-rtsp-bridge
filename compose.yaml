services:
  rtsp-bridge:
    build: .
    restart: unless-stopped
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    # Linux host networking preserves negotiated UDP addresses and ports.
    network_mode: host
    volumes:
      - ./config:/config:ro
      - ./logs:/logs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

listen_host: 0.0.0.0
udp_port_range: [20000, 20199]
request_timeout: 15
logging:
  level: DEBUG # INFO, DEBUG, TRACE (sanitized protocol detail)
  directory: /logs
  max_bytes: 10485760
  backups: 5
  stats_interval: 30
rules:
  - listen_port: 8554
    downstream_transport: udp
    audio_enabled: true # Set false for video-only clients such as TouchOne.
    upstream:
      url: rtsp://192.168.82.2:7447/REPLACE_WITH_STREAM_PATH
      transport: tcp
      # For RTSPS use rtsps://host:port/path and a trusted server certificate.
      # tls_verify: false # Accept untrusted certificates; skips server identity checks.
      # tls_ca_file: /config/protect-ca.pem
    credentials:
      mode: drop # drop, replace, passthrough
      # username: upstream-user
      # password: upstream-password

# Optional read-only HTTP monitoring. Loopback only by default.
dashboard:
  enabled: false
  host: 127.0.0.1
  port: 8080
